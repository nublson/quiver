name: Release

on:
  workflow_dispatch:

jobs:
  version:
    name: 📦 Version Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and update changelog
        run: pnpm changeset version

      - name: Commit and push version bump
        run: |
          git diff --quiet && git diff --staged --quiet || (git add . && git commit -m "chore: version packages")
          git push origin develop

  merge-develop:
    name: 🔀 Merge develop into main
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest changes
        run: |
          git fetch origin main
          git fetch origin develop

      - name: Checkout main branch
        run: git checkout main

      - name: Merge develop into main
        run: git merge origin/develop --no-edit
        env:
          GIT_MERGE_AUTOEDIT: no

      - name: Push merge to main
        run: git push origin main

  validate-build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: merge-develop
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Publish deploy gate status for Vercel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f "state=${STATE}" \
            -f context="release/build-validation" \
            -f description="Release workflow Build Validation"

  publish:
    name: 🚀 Publish to npm
    runs-on: ubuntu-latest
    needs: validate-build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter=usequiver

      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="usequiver@${VERSION}"
          # Extract the latest changelog entry (between first and second ## headings)
          NOTES=$(awk '/^## /{i++} i==1{print} i==2{exit}' packages/cli/CHANGELOG.md | tail -n +2)
          gh release create "$TAG" \
            --title "usequiver v${VERSION}" \
            --notes "$NOTES" \
            --repo "${{ github.repository }}"
