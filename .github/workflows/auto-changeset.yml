name: Auto Changeset

# Writes a changeset for each change to the usequiver package that lands on
# develop (see .github/scripts/auto-changeset.sh), so the next Release can bump
# the version and write the changelog. Same as nublson/notionic's: one
# changeset per pull request, its title as the changelog line.

on:
  push:
    branches:
      - develop

# No concurrency group: GitHub keeps only one pending run per group, so a burst
# of merges would drop a push's run and its changeset. Runs overlap instead, and
# each one rebases onto the others' commits before pushing.

jobs:
  auto-changeset:
    name: 📝 Auto Changeset
    runs-on: ubuntu-latest
    # Skip this workflow's and the release's own commits.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: add changesets') &&
      !startsWith(github.event.head_commit.message, 'chore: version packages')
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write changesets
        id: changesets
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/auto-changeset.sh

      - name: Commit and push changesets
        if: steps.changesets.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: add changesets"
          # Another merge, or another run's changesets, may have landed meanwhile.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin develop && git push origin develop && exit 0
            sleep $((attempt * 5))
          done
          exit 1
