name: Auto Changeset

on:
  push:
    branches:
      - develop

jobs:
  auto-changeset:
    name: 📝 Auto Changeset
    runs-on: ubuntu-latest
    # Skip if this push was made by the bot itself (prevents commit loop)
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect CLI changes and existing changeset
        id: check
        run: |
          CLI_CHANGED=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep '^packages/cli/' | head -1)
          CHANGESET_EXISTS=$(ls .changeset/*.md 2>/dev/null | grep -v README | head -1)
          echo "cli_changed=${CLI_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "changeset_exists=${CHANGESET_EXISTS}" >> "$GITHUB_OUTPUT"

      - name: Create changeset
        if: steps.check.outputs.cli_changed != '' && steps.check.outputs.changeset_exists == ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -1)

          if printf '%s' "$FIRST_LINE" | grep -qE '^feat(\([^)]*\))?!:|^[^:]+!:'; then
            BUMP="major"
          elif printf '%s' "$FIRST_LINE" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          DESCRIPTION=$(printf '%s' "$FIRST_LINE" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //')
          SLUG=$(printf '%s' "$DESCRIPTION" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/-$//' | cut -c1-50)

          {
            printf -- '---\n'
            printf '"usequiver": %s\n' "$BUMP"
            printf -- '---\n\n'
            printf '%s\n' "$DESCRIPTION"
          } > ".changeset/${SLUG}.md"

      - name: Commit and push changeset
        if: steps.check.outputs.cli_changed != '' && steps.check.outputs.changeset_exists == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: add changeset"
          git push origin develop
